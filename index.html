<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="left-side">
        <div class="visibility-div">
            <img class="odin-logo" src="assets/logo.png" alt="odin-logo">
            <span class="logo-text">ODIN</span>
        </div>
        <div class="footer">
            <p>Photo by...</p>
        </div>
    </div>

    <div class="right-side">
        <div class="text">
            <p>This is not a real online service! You know you need something like<br>  this in your life to help you realize your deepest dreams. <br> Sign up <em>now</em> to get started.</p>
        </div>
        
        <div class="subtext">
            <p>You <em>know</em> you want to.</p>
        </div>
        
        <div class="form">
            <form>
                <p class="text">Let's do this!</p>
                <div class="box">
                    <div class="left-form">
                        <label for="firstname">First Name:</label>
                        <input type="text" id="firstname" name="user_name" />

                        <label for="email">Email:</label>
                        <input type="email" id="mail" name="mail" />

                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" />
                    </div>

                    <div class="right-form">
                        <label for="lastname">Last Name:</label>
                        <input type="text" id="lastname" name="user_name" />
                                        
                        <label for="phonenumber">Phone Number:</label>
                        <input type="tel" id="phonenumber" name="phonenumber" />
                                
                        <label for="passwordconfirm">Confirm Password:</label>
                        <input type="password" id="passwordconfirm" name="passwordconfirm" />
                    </div>                         
                    <div class="empty-form-space">
                </div>    
                </div>
            </form>
        </div>
        
        <div class="btn-div">
            <button id="create-acc-btn" type="submit">Create Account</button>
        </div>
        <div class="sub-btn-text"> 
            <p>Already have an account? Log in</p>
        </div>
    </div>
</body>
</html>
