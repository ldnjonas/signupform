<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="left-side">
        <div class="visibility-div">
            <img class="odin-logo" src="assets/logo.png" alt="odin-logo">
            <span class="logo-text">ODIN</span>
        </div>
        <div class="footer">
            <p>Photo by...</p>
        </div>
    </div>

    <div class="right-side">s
        <div class="text">
            <p>text</p>
        </div>
        
        <div class="subtext">
            <p>You know you want to.</p>
        </div>
        
        <p>Let's do this!</p>
        <div class="form">
            <form>
                <div class="left-form">
                    <label for="firstname">First Name:</label>
                    <input type="text" id="firstname" name="user_name" />

                    <label for="email">Email:</label>
                    <input type="email" id="mail" name="mail" />

                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" />
                </div>

                <div class="right-form">
                    <label for="lastname">Last Name:</label>
                    <input type="text" id="lastname" name="user_name" />
                                    
                    <label for="phonenumber">Phone Number:</label>
                    <input type="tel" id="phonenumber" name="phonenumber" />
                              
                    <label for="passwordconfirm">Confirm Password:</label>
                    <input type="password" id="passwordconfirm" name="passwordconfirm" />
                </div>                         
            </form>
        </div>
        
        <div class="create-acc-btn">4</div>
            <button type="submit">Create Account</button>
        
        <div class="sub-btn-text"> 
            <p>Already have an account? Log in</p>
        </div>
    </div>
</body>
</html>
